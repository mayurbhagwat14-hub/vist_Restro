<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vist-logo-bronze.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF5ED" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>VIST Restaurant</title>
    <style>
      html, body {
        background-color: #FAF5ED;
        color: #2C1810;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        background-color: #FAF5ED;
      }
      @keyframes vistPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes vistSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .vist-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAF5ED;
        padding: 24px;
        box-sizing: border-box;
      }
      .vist-preloader-logo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #FFFDF9;
        border: 2px solid rgba(197, 160, 89, 0.4);
        box-shadow: 0 4px 20px rgba(44, 24, 16, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        animation: vistPulse 2s infinite ease-in-out;
      }
      .vist-preloader-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .vist-preloader-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: #2C1810;
        margin-top: 18px;
        text-transform: uppercase;
      }
      .vist-preloader-sub {
        font-family: 'Poppins', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: #C5A059;
        margin-top: 4px;
        text-transform: uppercase;
      }
      .vist-preloader-spinner {
        margin-top: 28px;
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(197, 160, 89, 0.25);
        border-top-color: #5C381E;
        border-radius: 50%;
        animation: vistSpin 0.75s linear infinite;
      }
    </style>
  </head>
  <body> 
    <div id="root">
      <div class="vist-preloader">
        <div class="vist-preloader-logo">
          <img src="/vist-logo-bronze.png" alt="VIST Restaurant" />
        </div>
        <div class="vist-preloader-title">VISIT</div>
        <div class="vist-preloader-sub">EST. 1996</div>
        <div class="vist-preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
